<!doctype html><meta charset="utf-8"><title>shadow</title>
<body style="margin:0;background:#000">
<my-player></my-player>
<script>
customElements.define('my-player', class extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<div style="position:relative"><video id="v" src="demo.mp4" muted autoplay loop playsinline width="960" height="540"></video></div>'; }
});
</script>
