<meta charset="utf-8">
<title>Midnight Owl Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One dark room: two equal panels (original | processed), chips underneath. Single dark theme on purpose. */
:root {
  --bg: #0b0c10; --panel: #15171d; --line: #2a2d36; --fg: #e6e7ea; --muted: #8a8f99; --accent: #ffc845;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
.wrap { max-width: 1600px; margin: 0 auto; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
header { display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header img { width: 30px; height: 30px; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }
figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
canvas { width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; background: #000; border-radius: 6px; max-width: 100%; }
.stack { position: relative; }
.stack #gl { position: absolute; inset: 0; }
figcaption { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
figcaption b { color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips + .chips { margin-top: -4px; }
button { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
label.inline { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
input[type=range] { width: 110px; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted); }
.sheet { width: 100%; border-radius: 6px; margin-top: 8px; }
#src { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>

<div class="wrap">
  <header>
    <img src="owl.png" alt="">
    <h1>Midnight Owl Lab</h1>
    <span class="chips" style="margin-left:auto"><kbd>O</kbd><kbd>Alt+O</kbd></span>
  </header>

  <div class="panels">
    <figure><canvas id="left" width="960" height="540"></canvas><figcaption>Original</figcaption></figure>
    <figure><div class="stack"><canvas id="right" width="960" height="540"></canvas><canvas id="gl" width="960" height="540"></canvas></div><figcaption><b id="modeName">Smart</b></figcaption></figure>
  </div>

  <div class="chips" id="modes" aria-label="Mode">
    <button type="button" data-mode="smart" aria-pressed="true">Smart</button>
    <button type="button" data-mode="invert">Invert</button>
    <button type="button" data-mode="classic">Classic invert</button>
    <button type="button" data-mode="dim">Dim</button>
    <button type="button" data-mode="mask">What flips</button>
    <button type="button" data-mode="off">Off</button>
    <span class="sep"></span>
    <label class="inline"><input type="checkbox" id="warm"> Warm</label>
    <label class="inline">Text <input type="range" id="cap" min="0.45" max="0.95" step="0.05" value="0.8"></label>
  </div>

  <div class="chips" aria-label="Playback">
    <button type="button" id="play">Pause</button>
    <button type="button" data-rate="1">1×</button>
    <button type="button" data-rate="1.5">1.5×</button>
    <button type="button" data-rate="2.5" aria-pressed="true">2.5×</button>
    <span class="sep"></span>
    <span class="chips" id="scenes"></span>
  </div>

  <img class="sheet" src="comparison.jpg" alt="Every test scene through every mode">
</div>

<video id="src" muted loop playsinline autoplay></video>
<script src="engine.js"></script>
<script>
const v = document.getElementById('src'), L = document.getElementById('left'), R = document.getElementById('right'), G = document.getElementById('gl');
const lx = L.getContext('2d'), rx = R.getContext('2d');
const engine = new OwlGL(G);
const names = { smart: 'Smart', invert: 'Invert', classic: 'Classic invert (CSS)', dim: 'Dim', mask: 'What flips: red board · green flipped · blue paper', off: 'Off' };
let mode = 'smart', enabled = true;

// One video feeds both panels, so they can never drift apart. The right panel is the real extension engine.
function frame() {
  if (v.readyState < 2) return;
  lx.drawImage(v, 0, 0, 960, 540);
  const m = enabled ? mode : 'off', gl = ['smart', 'invert', 'dim', 'mask'].includes(m);
  G.hidden = !gl; R.hidden = gl;
  if (gl) engine.render(v); else rx.drawImage(v, 0, 0, 960, 540);
}
(function loop() { frame(); requestAnimationFrame(loop); })();

function apply() {
  const m = enabled ? mode : 'off', warm = document.getElementById('warm').checked;
  engine.set({ mode: m, cap: +document.getElementById('cap').value, warm });
  R.style.filter = m === 'classic' ? 'invert(1)' : 'none';
  document.getElementById('modeName').textContent = enabled ? names[mode] : 'Off (press O)';
  frame();
}
const press = (sel, el) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', b === el));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; enabled = true; press('[data-mode]', b); apply(); }));
document.querySelectorAll('[data-rate]').forEach(b => b.addEventListener('click', () => { v.playbackRate = +b.dataset.rate; press('[data-rate]', b); }));
document.getElementById('warm').addEventListener('change', apply);
document.getElementById('cap').addEventListener('input', apply);
const playBtn = document.getElementById('play');
playBtn.addEventListener('click', () => v.paused ? v.play() : v.pause());
v.addEventListener('play', () => playBtn.textContent = 'Pause');
v.addEventListener('pause', () => playBtn.textContent = 'Play');
// Load the whole clip into memory so seeking works on any host, even without range requests.
fetch('demo.mp4').then(r => r.blob()).then(b => { v.src = URL.createObjectURL(b); })
  .catch(() => { v.src = 'demo.mp4'; })
  .finally(() => { v.playbackRate = 2.5; v.addEventListener('loadeddata', () => { v.playbackRate = 2.5; v.play().catch(() => playBtn.textContent = 'Play'); }, { once: true }); });
v.addEventListener('error', () => { if (v.src.startsWith('blob:')) v.src = 'demo.mp4'; });

const SCENES = [[0, 'Whiteboard'], [5, 'Blackboard'], [9, 'Slide + face'], [13, 'Face'], [17, 'Dark slide'], [20, 'Grey slide'], [23, 'Fast cuts'], [27, 'Fade in'], [31, 'Photo'], [34, 'Uneven light'], [37, 'Teacher']];
for (const [t, n] of SCENES) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = n;
  b.addEventListener('click', () => { v.currentTime = t + 0.6; });
  document.getElementById('scenes').append(b);
}

addEventListener('keydown', e => {
  if (e.code !== 'KeyO' || e.ctrlKey || e.metaKey || e.shiftKey || e.repeat) return;
  e.preventDefault(); enabled = !enabled; apply();
});
apply();
</script>
