name: Release
# Every push to main builds and lints the zips. If extension/manifest.json has a version that has no GitHub
# release yet, the release (tag v<version>, notes from docs/releases/v<version>.md, the three zips) is created.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build zips
        run: python3 build.py
      - name: Lint the Firefox package
        run: npx -y web-ext@10.8.0 lint --source-dir dist/firefox
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-owl-zips
          path: dist/*.zip
      - name: Version
        id: v
        run: echo "tag=v$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: seen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the GitHub release
        if: github.event_name != 'pull_request' && steps.seen.outputs.yes == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Midnight Owl ${{ steps.v.outputs.tag }}
          body_path: docs/releases/${{ steps.v.outputs.tag }}.md
          files: dist/*.zip
          make_latest: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: End-to-end tests in Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node test/run.js
