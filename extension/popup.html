<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Midnight Owl</title>
<style>
  body { width: 230px; margin: 12px; font: 13px/1.5 system-ui, sans-serif; }
  h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 15px; }
  fieldset { margin: 8px 0; }
  input[type=range] { width: 100%; }
  @media (pointer: coarse) { body { width: auto; font-size: 17px; } }
</style>
<h1><img id="owl" src="icons/off-48.png" width="28" height="28" alt=""> Midnight Owl</h1>
<form>
  <label><input type="checkbox" name="on"> On</label> <small>(<kbd>O</kbd> or <kbd>Alt</kbd>+<kbd>O</kbd>)</small>
  <fieldset>
    <legend>Mode</legend>
    <label><input type="radio" name="mode" value="smart"> Smart: dark boards, natural pictures</label><br>
    <label><input type="radio" name="mode" value="invert"> Invert everything</label><br>
    <label><input type="radio" name="mode" value="dim"> Dim only</label>
  </fieldset>
  <label>Brightness <input type="range" name="cap" min="0.45" max="0.95" step="0.05"></label><br>
  <label><input type="checkbox" name="warm"> Warm tint</label>
  <details>
    <summary>Diagnostics</summary>
    <label><input type="checkbox" name="debug"> Show stats on video and record a log</label><br>
    <button type="button" id="save">Save log</button>
    <button type="button" id="clear">Clear</button>
    <output id="count"></output>
  </details>
</form>
<script src="popup.js"></script>
</html>
