<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Midnight Owl</title>
<style>
  :root { --bg: #fff; --fg: #1d1f24; --muted: #6b7079; --line: #e3e5e9; --accent: #e29b13; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c22; --fg: #e8e9ec; --muted: #9096a0; --line: #30323b; --accent: #ffc845; } }
  body { margin: 0; width: 240px; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; display: grid; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 40px; height: 40px; }
  header b { flex: 1; font-size: 15px; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  fieldset label { flex: 1; text-align: center; padding: 6px 0; cursor: pointer; }
  fieldset input { position: absolute; opacity: 0; }
  fieldset label:has(:checked) { background: var(--accent); color: #1b1c22; font-weight: 600; }
  fieldset label:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  .switch { appearance: none; width: 40px; height: 22px; border-radius: 11px; background: var(--line); position: relative; cursor: pointer; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { left: 21px; }
  footer { color: var(--muted); font-size: 12px; }
  /* Firefox for Android opens the popup as a full page: bigger, touch-friendly controls. */
  @media (pointer: coarse) {
    body { width: auto; max-width: 440px; margin: 0 auto; padding: 24px 20px; font-size: 17px; gap: 20px; }
    header img { width: 56px; height: 56px; } header b { font-size: 20px; }
    fieldset label { padding: 12px 0; }
    .switch { width: 56px; height: 30px; border-radius: 15px; } .switch::after { width: 24px; height: 24px; } .switch:checked::after { left: 29px; }
    input[type=checkbox]:not(.switch) { width: 22px; height: 22px; }
    footer { display: none; }
  }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
<header>
  <img id="owl" src="icons/off-128.png" alt="">
  <b>Midnight Owl</b>
  <input type="checkbox" class="switch" id="on" aria-label="On">
</header>
<fieldset aria-label="Mode">
  <label title="Darkens bright boards only. Faces and photos stay natural."><input type="radio" name="mode" value="smart">Smart</label>
  <label title="Flips brightness of the whole video, keeps colours."><input type="radio" name="mode" value="invert">Invert</label>
  <label title="Only darkens, nothing flips."><input type="radio" name="mode" value="dim">Dim</label>
</fieldset>
<label class="row">Text <input type="range" id="cap" min="0.45" max="0.95" step="0.05"></label>
<label class="row"><input type="checkbox" id="warm"> Warm tint</label>
<footer><kbd>O</kbd> or <kbd>Alt</kbd>+<kbd>O</kbd> on any video</footer>
<script src="popup.js"></script>
</html>
